<script id="post-data" type="application/json">
{
  "title": "儿子学Python的第一道坎，不是语法，是键盘",
  "account": "编程娃他爸",

  "author": "编程娃他爸",
  "date": "2026年10月12日 13:25",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">上个月，我儿子坐在电脑前参加一场编程比赛。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">题目他会做。思路也对。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">但我站在他身后，看着他那两根食指在键盘上戳一下、抬头看一眼屏幕、再低头找下一个字母——一道题的时间，一小半花在了找键上。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1.6em;\">那一刻我意识到一件事：<strong>卡住他的不是编程，是键盘。</strong></p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;01&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:8px 0 26px;\">学 Python 之前，先被键盘拦住了</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">我儿子是低年级小学生。图形化编程刚\"毕业\"，拖拖积木块就能做游戏的那种。今年开始学 Python，正式进入敲代码的阶段。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">问题马上就来了。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">图形化编程几乎不用键盘，鼠标拖一拖就完事。可 Python 不一样——每个字母都得自己敲。26 个字母在哪儿、Shift 什么时候按、冒号和分号怎么够……对孩子来说，这些全是陌生的。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">他平时挺爱比赛的，今年在一个新的白名单赛事上拿了个全国总决赛一等奖——赛事比较新，我们主要图个比赛经验，奖不算硬核。但既然想在这条路上走下去，接下来还有考级、还有比赛，要敲的内容只会更多，手跟不上是真的白搭。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">我研究了一圈现成的打字练习工具：要么是英文界面、满屏广告；要么枯燥到像考试，孩子坐五分钟就跑。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">挑来挑去，我决定干脆自己做一个。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">说出来你可能不信：我在软件行业待了十几年，但从来没写过一行产品代码。<strong>我不是程序员。</strong></p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1.6em;\">但今年 AI 编程实在太猛，我特别想认真试一次：vibe coding、AI coding，到底能为孩子的学习和成长带来什么，又能为我们大人的工作、学习带来什么——是助力，还是相反？就拿这个小需求练手，学着带 AI 干活：我提需求、试玩、挑毛病，它来写。指法顺序怎么排、星球大战怎么玩，都是一轮一轮磨出来的。</p>\n\n<p style=\"text-align:center;margin:0 0 1.6em;\"><img src=\"assets/cert.png\" style=\"max-width:100%;border-radius:8px;\" /></p>\n\n<p style=\"text-align:center;font-size:13px;color:#999;margin:0 0 1.6em;\">他的获奖证书。赛事还比较新，我们主要图个经验。但比赛这条路他想走下去，我能做的，就是把路铺平一点。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;02&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:8px 0 26px;\">带着 AI，写了三个游戏</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">这个网站叫「键盘小达人」。设计思路只有一条：<strong>练键盘这件事，得让孩子觉得是在玩，不是在学。</strong></p>\n\n<p style=\"text-align:center;margin:0 0 1.6em;\"><img src=\"assets/home.png\" style=\"max-width:100%;border-radius:8px;\" /></p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">第一个模式叫「认识键盘」。屏幕上先出现两只小手的引导，孩子把手指摆对位置，再敲对应的键。按对了，会立刻有真人语音把字母读出来——26 个字母的读音都是提前录制好的，按键即出声，零延迟。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">第二个模式叫「找键位闯关」，一共六关。前面几关是\"看字母找按键\"，后面两关是他最喜欢的：一个是按 A 到 Z 的顺序弹奏字母歌，按错或停顿超过 2 秒就得从头再来；另一个是像素风的星球大战——字母开着战斗机从天上往下掉，按对键就发射激光把它击落。</p>\n\n<p style=\"text-align:center;margin:0 0 1.6em;\"><img src=\"assets/shooter.png\" style=\"max-width:100%;border-radius:8px;\" /></p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1.6em;\">他现在每天放学回家，先打两把星球大战再说。被击落了不服气，自己会念叨\"再来一次\"——我心里偷着乐，这不就是在练指法吗。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">第三个模式叫「趣味练打字」，从主键位热身开始，慢慢过渡到单词、拼音、小短句，再到 Shift 大小写组合。正确率 100% 的时候，会有一句\"你真棒\"的语音奖励——这句是他自己要求的。</p>\n\n<p style=\"text-align:center;margin:0 0 1.6em;\"><img src=\"assets/type.png\" style=\"max-width:100%;border-radius:8px;\" /></p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;03&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:8px 0 26px;\">给孩子的东西，我坚持了这几条</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">作为爸爸，我在这个网站上守住了几条底线：</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\"><strong>不用注册，打开就玩。</strong>孩子的注意力只有那么长，登录注册这一套走完，兴趣早就没了。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\"><strong>不收任何信息。</strong>纯前端网页，没有账号系统，不收集姓名、年龄、照片。孩子的练习记录只存在自己电脑的浏览器里，不上传任何服务器。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\"><strong>免费，而且没有广告。</strong>给孩子用的东西，不该有乱七八糟的弹窗。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1.6em;\"><strong>电脑上用效果最好。</strong>毕竟，学键盘就是为了以后敲真键盘的。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">有天晚上他练完，突然抬头跟我说：\"爸爸，我今天盲打了 asdf jkl;，一次都没低头。\"</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1.6em;\">那语气，跟拿了奖状一样骄傲。</p>\n\n<p style=\"text-align:center;font-size:24px;font-weight:bold;color:#1a1a1a;letter-spacing:2px;margin:50px 0 0;\">—&nbsp;&nbsp;04&nbsp;&nbsp;—</p>\n<p style=\"text-align:center;font-size:19px;font-weight:bold;color:#333;margin:8px 0 26px;\">如果你家也有个学编程的娃</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">这个网站现在就挂在互联网上，谁都能用，不用问我。它还会一直更新——最近刚加了一个「游乐场」：打字测速挑战、每日挑战、打地鼠、音乐盒，还有蛋仔装扮商店和成就徽章墙，闯关攒的星星可以给孩子的小蛋仔买蝴蝶结、戴皇冠。后面有空，我再让 AI 继续加新玩法。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">源码也放在了 GitHub 上，欢迎关注、欢迎提建议：<strong>github.com/shaun-zou/keyboard-learning-game</strong></p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1.6em;\">提醒一句：临时域名偶尔会不稳定。哪天打不开，就去 GitHub 仓库把整个项目下载下来，解压后双击就能在本地玩；或者直接后台留言找我，我把打包好的静态文件发你。</p>\n\n<p style=\"text-align:center;margin:0 0 0.6em;\"><img src=\"assets/poster.png\" style=\"max-width:100%;border-radius:8px;\" /></p>\n\n<p style=\"text-align:center;font-size:13px;color:#999;margin:0 0 1.6em;\">扫码或点击文末「阅读原文」，在电脑上打开就能玩。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">我没法替他上赛场，也没法替他敲代码。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1em;\">但键盘这一关，我可以陪他练过去。</p>\n\n<p style=\"font-size:15px;line-height:2;color:#3f3f3f;margin:0 0 1.6em;\"><strong style=\"color:#6366f1;\">也许你的孩子，也用得上。</strong></p>\n"
}

  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || '编程娃他爸';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
